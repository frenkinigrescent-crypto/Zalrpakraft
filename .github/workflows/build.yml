name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: "Server self-test (world loads, house is built, configs written)"
        timeout-minutes: 25
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "level-seed=4242\nonline-mode=false\nspawn-protection=0\nmax-tick-time=-1\n" > run/server.properties
          ZK_SELFTEST=$PWD/selftest.txt timeout 1200 ./gradlew runServer 2>&1 | tee server.log | grep -E "Zalepacraft|ERROR|Exception" || true
          cat selftest.txt
          grep -q "RESULT OK" selftest.txt
      - name: "Client self-test (screenshots of menu, map, plaques, intro, journal)"
        timeout-minutes: 30
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          mkdir -p run
          printf "onboardAccessibility:false\nskipMultiplayerWarning:true\nlang:ru_ru\nguiScale:2\nnarrator:0\ntutorialStep:none\nsoundCategory_master:0.0\n" > run/options.txt
          mkdir -p run/saves && cp -r run/world "run/saves/zk_test" 2>/dev/null || true
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.5 ZK_CLIENTTEST=1
          timeout 1700 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient 2>&1 | tee client.log | grep -E "clienttest|ERROR|Exception|Caused" | head -60 || true
          ls -la run/screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zalrpakraft
          path: |
            build/libs/*.jar
            build.log
            server.log
            selftest.txt
            client.log
            run/screenshots/*.png
      - name: Publish jar (release + builds branch)
        if: github.event_name == 'push' && success()
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$JAR" -t "Zalepacraft (последняя сборка)" -n "Автосборка из ${GITHUB_SHA::7}"
          mkdir -p /tmp/b/screenshots && cp "$JAR" /tmp/b/ && cp run/screenshots/zk_*.png /tmp/b/screenshots/ 2>/dev/null || true
          cp selftest.txt /tmp/b/ 2>/dev/null || true
          grep -E "clienttest|Exception|Caused" client.log | head -80 > /tmp/b/clienttest.txt 2>/dev/null || true
          cd /tmp/b
          git init -q -b builds && git add . 
          git -c user.name=ci -c user.email=ci@localhost commit -qm "jar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
