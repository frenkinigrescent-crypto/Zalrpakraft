name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: "Server self-test (world loads, house is built, configs written)"
        timeout-minutes: 25
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "level-seed=4242\nonline-mode=false\nspawn-protection=0\nmax-tick-time=-1\n" > run/server.properties
          ZK_SELFTEST=$PWD/selftest.txt timeout 1200 ./gradlew runServer 2>&1 | tee server.log | grep -E "Zalrpakraft|ERROR|Exception" || true
          cat selftest.txt
          grep -q "RESULT OK" selftest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zalrpakraft
          path: |
            build/libs/*.jar
            build.log
            server.log
            selftest.txt
      - name: Publish jar (release + builds branch)
        if: github.event_name == 'push' && success()
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$JAR" -t "Zalrpakraft (последняя сборка)" -n "Автосборка из ${GITHUB_SHA::7}"
          mkdir /tmp/b && cp "$JAR" /tmp/b/ && cd /tmp/b
          git init -q -b builds && git add . 
          git -c user.name=ci -c user.email=ci@localhost commit -qm "jar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
